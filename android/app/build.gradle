plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chabakharu.handoff'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chabakharu.handoff'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug { buildConfigField 'boolean', 'DEMO_UI', 'true' }
        release { buildConfigField 'boolean', 'DEMO_UI', 'false' }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDirs += [rootProject.file('../web')]
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}
